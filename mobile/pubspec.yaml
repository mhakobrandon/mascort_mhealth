name: mascot_mhealth
description: MASCOT mHealth - Youth Sexual Health Platform for Zimbabwe

publish_to: 'none'
version: 1.0.0+1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/splash.png"
  min_sdk_android: 21


environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  http: ^1.2.0
  provider: ^6.1.2
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.0.0
  cached_network_image: ^3.3.1
  url_launcher: ^6.2.6
  flutter_map: ^6.1.0
  latlong2: ^0.9.1
  flutter_svg: ^2.0.10+1
  lottie: ^3.1.0
  intl: ^0.19.0
  uuid: ^4.4.0
  # video_player: ^2.9.2
  video_player: ^2.11.1

  geolocator: ^10.1.0
  permission_handler: ^11.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
    - assets/left.png
    - assets/right.png
    - assets/person.png
    - assets/condoms.png
    - assets/copper_iud.png
    - assets/implant.png
    - assets/emergency_contraceptive.png
    - assets/condoms.png
    - assets/prep.png
    - assets/pep.png
    - assets/depo.png
    - assets/hiv_general.png
    - assets/contraceptive.png
    - assets/female_condoms.jpg
    - assets/videos/
    - assets/four.png
    - assets/three.png
    - assets/two.png
    - assets/one.png
    - assets/cabotegr.png
    - assets/lenacapavir.png
    - assets/dapivirine.png
    - assets/pop.png
    - assets/sayana.png

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
