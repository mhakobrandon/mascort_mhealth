<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Log in to Mascot — confidential student health dashboard." />
  <title>Log In — Mascot</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <style>
    /* ── Reset ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ── Page ── */
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 16px 48px;
      background-color: #EEF5E8;
      background-image:
        radial-gradient(ellipse 75% 55% at 18%  8%,  rgba(147,201,98,.22) 0%, transparent 62%),
        radial-gradient(ellipse 55% 45% at 82% 92%,  rgba(76,175,80,.15)  0%, transparent 58%),
        radial-gradient(ellipse 40% 40% at 52% 48%,  rgba(235,247,225,.55) 0%, transparent 72%);
    }

    /* ── Card ── */
    .card {
      position: relative;
      width: 100%;
      max-width: 448px;
      /* Subtle textured light-grey card background */
      background-color: #F3F3F3;
      background-image:
        radial-gradient(rgba(0,0,0,.055) 1px, transparent 1px);
      background-size: 18px 18px;
      border-radius: 24px;
      padding: 44px 40px 40px;
      box-shadow:
        0 1px 2px  rgba(0,0,0,.04),
        0 4px 12px rgba(0,0,0,.07),
        0 16px 40px rgba(0,0,0,.08),
        0 0 0 1px rgba(0,0,0,.05);
      overflow: hidden;
    }

    /* ── Logo (centred inside card) ── */
    .card-logo {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 26px;
    }
    .logo-icon {
      width: 48px;
      height: 48px;
      border-radius: 13px;
      background: #fff;
      border: 1.5px solid rgba(147,201,98,.35);
      box-shadow: 0 2px 10px rgba(147,201,98,.22);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      overflow: hidden;
    }
    .logo-icon img {
      width: 38px;
      height: 38px;
      object-fit: contain;
    }
    .logo-text img {
      height: 26px;
      width: auto;
      object-fit: contain;
    }

    /* ── Card header ── */
    .card-header {
      text-align: center;
      margin-bottom: 30px;
    }
    .card-title {
      font-size: 27px;
      font-weight: 800;
      color: #1A1A1A;
      letter-spacing: -.55px;
      line-height: 1.15;
      margin-bottom: 9px;
    }
    .card-subtitle {
      font-size: 14px;
      color: #6B6B6B;
      line-height: 1.55;
    }

    /* ── Form layout ── */
    .form { display: flex; flex-direction: column; gap: 20px; }

    /* ── Field ── */
    .field { display: flex; flex-direction: column; gap: 7px; }

    .field-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    label {
      font-size: 13px;
      font-weight: 600;
      color: #2A2A2A;
      cursor: default;
    }
    .forgot-link {
      font-size: 12.5px;
      font-weight: 500;
      color: #3d9140;
      text-decoration: none;
      transition: color .15s;
    }
    .forgot-link:hover { color: #2e6b30; text-decoration: underline; }

    /* ── Inputs ── */
    .input-wrap { position: relative; }

    input[type="text"],
    input[type="email"],
    input[type="password"] {
      width: 100%;
      height: 50px;
      padding: 0 16px;
      font-size: 14.5px;
      font-family: inherit;
      color: #1A1A1A;
      background: #E9E9E9;
      border: 1.5px solid #D8D8D8;
      border-radius: 11px;
      outline: none;
      -webkit-appearance: none;
      appearance: none;
      transition: border-color .18s, background .18s, box-shadow .18s;
    }
    input::placeholder { color: #A4A4A4; }
    input:hover:not(:focus) { border-color: #C0C0C0; }
    input:focus {
      border-color: #4CAF50;
      background: #fff;
      box-shadow: 0 0 0 3.5px rgba(76,175,80,.18);
    }
    input[type="password"] { padding-right: 50px; }

    /* ── Eye toggle ── */
    .eye-btn {
      position: absolute;
      right: 5px;
      top: 50%;
      transform: translateY(-50%);
      width: 40px;
      height: 40px;
      background: none;
      border: none;
      cursor: pointer;
      color: #ABABAB;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 9px;
      transition: color .15s, background .15s;
      padding: 0;
    }
    .eye-btn:hover { color: #555; background: rgba(0,0,0,.06); }

    /* ── Remember Me row ── */
    .remember-row {
      display: flex;
      align-items: center;
      gap: 9px;
      margin-top: -4px;
    }
    input[type="checkbox"] {
      width: 17px;
      height: 17px;
      min-width: 17px;
      accent-color: #4CAF50;
      cursor: pointer;
    }
    .remember-label {
      font-size: 13.5px;
      color: #555;
      cursor: pointer;
      user-select: none;
      line-height: 1;
    }

    /* ── Log In button ── */
    .btn-login {
      width: 100%;
      height: 52px;
      background: #4CAF50;
      color: #fff;
      border: none;
      border-radius: 11px;
      font-size: 15.5px;
      font-weight: 700;
      font-family: inherit;
      letter-spacing: .1px;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      box-shadow: 0 4px 16px rgba(76,175,80,.38);
      transition: transform .15s ease, box-shadow .15s ease, filter .15s ease;
      margin-top: 4px;
    }
    .btn-login::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(255,255,255,.13) 0%, transparent 55%);
      pointer-events: none;
    }
    .btn-login:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 22px rgba(76,175,80,.46);
      filter: brightness(1.05);
    }
    .btn-login:active {
      transform: translateY(0);
      box-shadow: 0 2px 8px rgba(76,175,80,.28);
    }

    /* ── Or divider ── */
    .or-divider {
      display: flex;
      align-items: center;
      gap: 13px;
      margin: 26px 0 20px;
    }
    .or-line {
      flex: 1;
      height: 1px;
      background: #D5D5D5;
    }
    .or-text {
      font-size: 12px;
      color: #999;
      white-space: nowrap;
      font-weight: 500;
      letter-spacing: .2px;
    }

    /* ── Social buttons ── */
    .social-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 26px;
    }
    .btn-social {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      height: 48px;
      background: #E8E8E8;
      border: 1.5px solid #D5D5D5;
      border-radius: 11px;
      font-size: 14px;
      font-weight: 600;
      color: #2A2A2A;
      font-family: inherit;
      cursor: pointer;
      transition: background .15s, border-color .15s, transform .1s;
    }
    .btn-social:hover {
      background: #E0E0E0;
      border-color: #C5C5C5;
      transform: translateY(-1px);
    }
    .btn-social:active { transform: translateY(0); }

    /* ── Card footer ── */
    .card-footer {
      text-align: center;
      font-size: 13.5px;
      color: #666;
      line-height: 1.5;
    }
    .card-footer a {
      color: #3d9140;
      font-weight: 700;
      text-decoration: none;
      margin-left: 3px;
      transition: color .15s;
    }
    .card-footer a:hover { color: #2e6b30; text-decoration: underline; }

    /* ── Sparkle (bottom-right of card) ── */
    .sparkle {
      position: absolute;
      bottom: 14px;
      right: 16px;
      pointer-events: none;
      opacity: .45;
    }

    /* ── Responsive ── */
    @media (max-width: 480px) {
      .card { padding: 32px 22px 32px; border-radius: 20px; }
      .card-title { font-size: 23px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        transition-duration: .01ms !important;
        animation-duration: .01ms !important;
      }
    }
  </style>
</head>

<body>
  <main>
    <div class="card" role="region" aria-labelledby="form-title">

      <!-- Logo centred at top of card -->
      <div class="card-logo" role="img" aria-label="Mascot mHealth">
        <div class="logo-icon">
          <img src="/mascot-logo.png" alt="" aria-hidden="true" />
        </div>
        <div class="logo-text">
          <img src="/mascot-text.png" alt="mascot" />
        </div>
      </div>

      <!-- Heading -->
      <header class="card-header">
        <h1 class="card-title" id="form-title">Welcome Back</h1>
        <p class="card-subtitle">Log in to your confidential student dashboard.</p>
      </header>

      <!-- Form -->
      <form id="login-form" class="form" novalidate onsubmit="handleLogin(event)">

        <!-- Email or Username -->
        <div class="field">
          <label for="email">Email or Username</label>
          <div class="input-wrap">
            <input
              id="email"
              type="text"
              name="email"
              autocomplete="username"
              placeholder="Enter email or username"
              aria-required="true"
            />
          </div>
        </div>

        <!-- Password -->
        <div class="field">
          <div class="field-header">
            <label for="password">Password</label>
            <a href="forgot-password.html" class="forgot-link">Forgot Password?</a>
          </div>
          <div class="input-wrap">
            <input
              id="password"
              type="password"
              name="password"
              autocomplete="current-password"
              placeholder="Password"
              aria-required="true"
            />
            <!-- Eye icon with diagonal line through it (password hidden state) -->
            <button
              type="button"
              class="eye-btn"
              id="eye-btn"
              aria-label="Show password"
              aria-pressed="false"
              onclick="togglePassword()"
            >
              <svg id="icon-eye-off" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94"/>
                <path d="M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19"/>
                <path d="M14.12 14.12a3 3 0 11-4.24-4.24"/>
                <line x1="1" y1="1" x2="23" y2="23"/>
              </svg>
              <svg id="icon-eye-on" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:none">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
        </div>

        <!-- Remember Me -->
        <div class="remember-row">
          <input type="checkbox" id="remember" name="remember" />
          <label class="remember-label" for="remember">Remember Me</label>
        </div>

        <!-- Log In -->
        <button type="submit" class="btn-login">Log In</button>

      </form>

      <!-- Divider -->
      <div class="or-divider" role="separator" aria-label="Or log in with">
        <div class="or-line"></div>
        <span class="or-text">Or log in with:</span>
        <div class="or-line"></div>
      </div>

      <!-- Social login -->
      <div class="social-grid" role="group" aria-label="Social login options">
        <button class="btn-social" type="button" aria-label="Continue with Google">
          <!-- Google G -->
          <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
            <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
            <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
            <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
          </svg>
          Google
        </button>
        <button class="btn-social" type="button" aria-label="Continue with Apple">
          <!-- Apple logo -->
          <svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.8-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11z"/>
          </svg>
          Apple
        </button>
      </div>

      <!-- Footer -->
      <div class="card-footer">
        New to Mascot?<a href="/signup.html">Create an Account</a>
      </div>

      <!-- Sparkle — bottom-right corner of card -->
      <div class="sparkle" aria-hidden="true">
        <svg width="30" height="30" viewBox="0 0 30 30" fill="none">
          <!-- Large star -->
          <path d="M15 2L16.8 12L26 15L16.8 18L15 28L13.2 18L4 15L13.2 12Z"
                fill="#93C962" opacity=".75"/>
          <!-- Small star top-right -->
          <path d="M25 3L25.9 6.1L29 7L25.9 7.9L25 11L24.1 7.9L21 7L24.1 6.1Z"
                fill="#93C962" opacity=".55"/>
          <!-- Tiny star bottom-left -->
          <path d="M5 20L5.6 22.4L8 23L5.6 23.6L5 26L4.4 23.6L2 23L4.4 22.4Z"
                fill="#93C962" opacity=".42"/>
        </svg>
      </div>

    </div>
  </main>

  <script>
    /* ── Toggle password visibility ── */
    function togglePassword() {
      const pwd     = document.getElementById('password');
      const btn     = document.getElementById('eye-btn');
      const iconOff = document.getElementById('icon-eye-off');
      const iconOn  = document.getElementById('icon-eye-on');
      const hidden  = pwd.type === 'password';

      pwd.type              = hidden ? 'text'  : 'password';
      iconOff.style.display = hidden ? 'none'  : '';
      iconOn.style.display  = hidden ? ''      : 'none';
      btn.setAttribute('aria-label',  hidden ? 'Hide password' : 'Show password');
      btn.setAttribute('aria-pressed', hidden ? 'true'          : 'false');
    }

    /* ── Form submit ── */
    function handleLogin(e) {
      e.preventDefault();
      const email    = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      if (!email || !password) {
        if (!email)    document.getElementById('email').focus();
        else           document.getElementById('password').focus();
        return;
      }
      /* TODO: wire up to backend auth */
      console.log('Login submitted', { email });
    }
  </script>
</body>
</html>
